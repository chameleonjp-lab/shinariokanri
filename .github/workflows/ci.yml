name: Validate implementation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_completion_plan.py
      - run: python3 -m unittest discover -s scripts -p 'test_check_*.py' -v
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - run: npm test
      - run: npm run build
      - run: BROWSER_ENGINES=all npm run test:e2e
      - run: npx playwright test -c tests/rb10/playwright.config.ts --project=chromium --output=test-results/rb10-large-analysis-chromium
      - run: RB03_ENGINES=chromium,firefox,webkit node tests/browser/run-rb03-components.mjs
      - run: |
          for engine in chromium firefox webkit; do
            RB04_ENGINE="$engine" RB04_OUTPUT_DIR=test-results/rb04 node tests/browser/rb04-author-regressions.mjs
          done
      - run: npx playwright test -c tests/rb04/playwright.config.ts --project=chromium --output=test-results/rb04-writing-chromium
      - run: npx playwright test -c tests/rb04/playwright.config.ts --project=webkit --output=test-results/rb04-writing-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
